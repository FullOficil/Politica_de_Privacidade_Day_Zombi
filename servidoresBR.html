<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servidores BR</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  overflow: hidden;
  background: #000;
}

/* 🔥 FUNDO ANIMADO */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
  z-index: -2;
}

/* Névoa */
.fog {
  position: fixed;
  width: 200%;
  height: 200%;
  background: url('https://i.imgur.com/8yKXslF.png');
  opacity: 0.05;
  animation: moveFog 60s linear infinite;
  z-index: -1;
}

@keyframes moveFog {
  from { transform: translate(0,0); }
  to { transform: translate(-50%, -50%); }
}

/* Luz piscando */
.light {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(0,200,83,0.05), transparent);
  animation: pulse 4s infinite;
  z-index: -1;
}

@keyframes pulse {
  0%,100% { opacity: 0.1; }
  50% { opacity: 0.3; }
}

/* CONTEÚDO */
.container {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
  padding: 20px;
}

h2 {
  margin-bottom: 20px;
}

/* AVISO */
.aviso {
  background: rgba(0,0,0,0.6);
  padding: 20px;
  border-radius: 15px;
  border: 1px solid #00c853;
  max-width: 300px;
  font-size: 14px;
}

/* BOTÃO */
button {
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 25px;
  border: none;
  background: #00c853;
  color: black;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="fog"></div>
<div class="light"></div>

<div class="container">
  <h2>🌎 Servidores BR</h2>

  <div class="aviso">
    🚧 Em breve teremos servidores BR disponíveis para mobile.<br><br>
    Fique ligado nas atualizações!
  </div>

  <button onclick="location.href='./index.html'">⬅ Voltar</button>
</div>

</body>
</html>
