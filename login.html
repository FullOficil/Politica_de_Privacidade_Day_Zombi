<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body {
  margin: 0;
  background: #121212;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CARD */
.box {
  width: 90%;
  max-width: 320px;
  background: #1f1f1f;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

/* TITULO */
.title {
  text-align: center;
  font-size: 20px;
  margin-bottom: 20px;
}

/* INPUT */
.input-group {
  margin-bottom: 15px;
}

.input-group input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #121212;
  color: white;
  font-size: 14px;
}

/* BOTÃO */
.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 20px;
  background: #00c853;
  color: black;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

.btn.secondary {
  background: transparent;
  color: #00c853;
  border: 1px solid #00c853;
}

/* TEXTO */
.switch {
  text-align: center;
  font-size: 13px;
  margin-top: 15px;
  color: #aaa;
  cursor: pointer;
}

/* LOADING */
.loading {
  text-align: center;
  margin-top: 10px;
  display: none;
}

/* ERRO */
.msg {
  font-size: 13px;
  color: #ff5252;
  text-align: center;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="box">
  <div class="title" id="titulo">Entrar</div>

  <div class="input-group">
    <input id="nick" placeholder="Nick">
  </div>

  <div class="input-group">
    <input id="senha" type="password" placeholder="Senha">
  </div>

  <button class="btn" onclick="acao()" id="mainBtn">Entrar</button>

  <div class="switch" onclick="trocarModo()" id="switchText">
    Não tem conta? Criar
  </div>

  <div class="loading" id="loading">Carregando...</div>
  <div class="msg" id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyB5A-ySceXCFRQ7iSCnOA68nRJqYpK6DQc",
  databaseURL:"https://dayzozmbi-server-default-rtdb.firebaseio.com"
});

const db = getDatabase(app);

let modo = "login";

window.trocarModo = () => {
  modo = modo === "login" ? "criar" : "login";

  document.getElementById("titulo").innerText = modo === "login" ? "Entrar" : "Criar Conta";
  document.getElementById("mainBtn").innerText = modo === "login" ? "Entrar" : "Criar";
  document.getElementById("switchText").innerText =
    modo === "login" ? "Não tem conta? Criar" : "Já tem conta? Entrar";

  msg.innerText = "";
};

window.acao = async () => {
  const n = nick.value.trim();
  const s = senha.value.trim();

  msg.innerText = "";
  loading.style.display = "block";

  if (!n || !s) {
    erro("Preencha todos os campos");
    return;
  }

  try {
    if (modo === "criar") {
      const existe = await get(child(ref(db), "usuarios/" + n));

      if (existe.exists()) {
        erro("Usuário já existe");
        return;
      }

      await set(ref(db, "usuarios/" + n), { senha: s });

      sucesso(n);
    } else {
      const snap = await get(child(ref(db), "usuarios/" + n));

      if (!snap.exists()) {
        erro("Usuário não encontrado");
        return;
      }

      if (snap.val().senha !== s) {
        erro("Senha incorreta");
        return;
      }

      sucesso(n);
    }

  } catch (e) {
    erro("Erro de conexão");
  }
};

function erro(texto) {
  loading.style.display = "none";
  msg.innerText = texto;
}

function sucesso(user) {
  localStorage.setItem("user", user);
  location.href = "./index.html";
}
</script>

</body>
</html>
