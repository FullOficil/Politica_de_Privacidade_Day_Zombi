<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: #000;
}

/* 🔥 FUNDO */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
  z-index: -2;
}

.fog {
  position: fixed;
  width: 200%;
  height: 200%;
  background: url('https://i.imgur.com/8yKXslF.png');
  opacity: 0.05;
  animation: moveFog 60s linear infinite;
  z-index: -1;
}

@keyframes moveFog {
  from { transform: translate(0,0); }
  to { transform: translate(-50%, -50%); }
}

/* CONTAINER */
.container {
  padding: 20px;
}

/* HEADER */
.top {
  display: flex;
  gap: 15px;
  align-items: center;
}

.top img {
  width: 80px;
  border-radius: 15px;
}

.title {
  font-size: 18px;
}

/* BOTÃO */
.download-btn {
  background: #00c853;
  border: none;
  padding: 15px;
  width: 100%;
  border-radius: 25px;
  margin-top: 20px;
  font-weight: bold;
  cursor: pointer;
}

/* TEXTO */
.desc {
  margin-top: 15px;
  color: #aaa;
  font-size: 14px;
}

/* BOTÃO VOLTAR */
button.back {
  margin-top: 20px;
  padding: 10px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="fog"></div>

<div class="container">

  <div class="top">
    <img src="https://upload.wikimedia.org/wikipedia/en/8/80/Project_Zomboid_logo.png">
    <div>
      <div class="title">Project Zomboid Mobile</div>
      <div style="font-size:12px;color:#aaa;">Versão adaptada</div>
    </div>
  </div>

  <button class="download-btn" onclick="baixar()">
    ⬇ Baixar APK
  </button>

  <div class="desc">
    Versão adaptada para dispositivos mobile.<br><br>
    ⚠️ Não é oficial.<br>
    Pode conter bugs.<br>
    Recomendado aparelhos mais potentes.
  </div>

  <button class="back" onclick="location.href='./index.html'">
    ⬅ Voltar
  </button>

</div>

<script>
function baixar(){
  const user = localStorage.getItem("user");

  if(!user){
    alert("Faça login para baixar");
    window.location.href = "./login.html";
    return;
  }

  window.open(
    "https://www.mediafire.com/file/vwuz9wds0sw3rqd/Project_zomboid_mobile.zip/file?dkey=0mnmi769mnk&r=1074",
    "_blank"
  );
}
</script>

</body>
</html>
