<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Global</title>

<style>
:root {
  --bg: #0a0a0a;
  --panel: #141414;
  --panel2: #1c1c1c;
  --green: #00c853;
  --text: #ffffff;
  --muted: #9aa0a6;
}

/* BASE */
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  padding: 14px;
  background: rgba(20,20,20,0.9);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #222;
}

.header button {
  background: transparent;
  border: 1px solid #333;
  color: white;
  padding: 6px 12px;
  border-radius: 12px;
}

/* CHAT AREA */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* MESSAGE WRAPPER */
.msg {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  max-width: 85%;
  animation: pop 0.2s ease;
}

@keyframes pop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* LEFT/RIGHT ALIGN */
.left {
  align-self: flex-start;
  flex-direction: row;
}

.right {
  align-self: flex-end;
  flex-direction: row-reverse;
}

/* AVATAR */
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #2a2a2a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: white;
}

/* BUBBLE */
.bubble {
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.3;
  background: var(--panel2);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  position: relative;
}

.right .bubble {
  background: var(--green);
  color: black;
}

/* NICK */
.nick {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 3px;
}

/* REPLY */
.reply {
  font-size: 11px;
  padding-left: 8px;
  border-left: 2px solid #666;
  margin-bottom: 6px;
  color: #ccc;
  opacity: 0.8;
}

/* INPUT AREA */
.input-bar {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: rgba(20,20,20,0.95);
  border-top: 1px solid #222;
  backdrop-filter: blur(10px);
}

.input-bar input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #1f1f1f;
  color: white;
}

.input-bar button {
  background: var(--green);
  border: none;
  padding: 10px 14px;
  border-radius: 20px;
  font-weight: bold;
}

/* REPLY BOX */
.replyBox {
  font-size: 12px;
  padding: 6px 10px;
  background: #1f1f1f;
  border-left: 3px solid var(--green);
  display: none;
}
</style>
</head>

<body>

<div class="header">
  <div>💬 Chat Global</div>
  <button onclick="back()">Voltar</button>
</div>

<div id="chat"></div>

<div id="replyBox" class="replyBox"></div>

<div class="input-bar">
  <input id="msgInput" placeholder="Digite uma mensagem...">
  <button onclick="send()">Enviar</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyB5A-ySceXCFRQ7iSCnOA68nRJqYpK6DQc",
  databaseURL:"https://dayzozmbi-server-default-rtdb.firebaseio.com"
});

const db = getDatabase(app);

const user = localStorage.getItem("user");
if(!user){
  location.href="./login.html";
}

/* REPLY */
let replyMsg = null;

/* SEND */
window.send = () => {
  const text = msgInput.value.trim();
  if(!text) return;

  push(ref(db,"chatGlobal"), {
    nick: user,
    msg: text,
    reply: replyMsg
  });

  msgInput.value = "";
  replyMsg = null;
  replyBox.style.display = "none";
};

/* LOAD */
onValue(ref(db,"chatGlobal"), snap => {
  chat.innerHTML = "";

  snap.forEach(i => {
    const d = i.val();
    const isMe = d.nick === user;

    const msg = document.createElement("div");
    msg.className = "msg " + (isMe ? "right" : "left");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.innerText = d.nick[0].toUpperCase();

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    let replyHTML = "";
    if(d.reply){
      replyHTML = `<div class="reply">↩ ${d.reply}</div>`;
    }

    bubble.innerHTML = `
      <div class="nick">${d.nick}</div>
      ${replyHTML}
      ${d.msg}
    `;

    msg.onclick = () => {
      replyMsg = d.msg;
      replyBox.style.display = "block";
      replyBox.innerText = "Respondendo: " + d.msg;
    };

    msg.appendChild(avatar);
    msg.appendChild(bubble);

    chat.appendChild(msg);
  });

  chat.scrollTop = chat.scrollHeight;
});

/* BACK */
window.back = () => {
  location.href="./index.html";
};
</script>

</body>
</html>
