<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModSteam</title>

<style>
body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

/* 🔥 FUNDO ANIMADO */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
  z-index: -2;
}

.fog {
  position: fixed;
  width: 200%;
  height: 200%;
  background: url('https://i.imgur.com/8yKXslF.png');
  opacity: 0.05;
  animation: moveFog 60s linear infinite;
  z-index: -1;
}

@keyframes moveFog {
  from { transform: translate(0,0); }
  to { transform: translate(-50%, -50%); }
}

.light {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(0,200,83,0.05), transparent);
  animation: pulse 4s infinite;
  z-index: -1;
}

@keyframes pulse {
  0%,100% { opacity: 0.1; }
  50% { opacity: 0.3; }
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  position: relative;
  z-index: 1;
}

.user-area {
  display: flex;
  gap: 10px;
  align-items: center;
}

button {
  border: none;
  padding: 8px 12px;
  border-radius: 20px;
  cursor: pointer;
}

#loginBtn { background: #00c853; }
#logoutBtn { background: #ff5252; display:none; }

/* MENU */
.menu {
  padding: 20px;
  position: relative;
  z-index: 1;
}

.item {
  display: block;
  background: rgba(31,31,31,0.85);
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 10px;
  text-decoration: none;
  color: white;
  backdrop-filter: blur(5px);
}

/* DESTAQUE */
.highlight {
  border: 1px solid #00c853;
  box-shadow: 0 0 10px rgba(0,200,83,0.3);
}
</style>
</head>
<body>

<!-- FUNDO -->
<div class="bg"></div>
<div class="fog"></div>
<div class="light"></div>

<!-- HEADER -->
<div class="header">
  <div>ModSteam</div>

  <div class="user-area">
    <span id="userName"></span>
    <button id="loginBtn" onclick="abrirLogin()">Entrar</button>
    <button id="logoutBtn" onclick="logout()">Sair</button>
  </div>
</div>

<!-- MENU -->
<div class="menu">

  <a class="item" href="./mods.html">📦 Mods</a>

  <a class="item" href="./servidoresBR.html">🌎 ServidoresBR</a>

  <a class="item highlight" href="./download.html">
    🧟 Download Project Zomboid (Mobile)
  </a>

  <!-- 🔥 NOVO CHAT -->
  <a class="item" href="./chat.html">💬 Chat Global</a>

</div>

<script>
function abrirLogin() {
  window.location.href = "./login.html";
}

function logout() {
  localStorage.removeItem("user");
  location.reload();
}

const user = localStorage.getItem("user");

if (user) {
  document.getElementById("userName").innerText = user;
  document.getElementById("loginBtn").style.display = "none";
  document.getElementById("logoutBtn").style.display = "block";
}
</script>

</body>
</html>
